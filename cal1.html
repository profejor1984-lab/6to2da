<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculadora - estilo Windows Forms</title>
  <style>
    /* Reset básico */
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;background:#2b2b2b;display:flex;align-items:flex-start;justify-content:center;padding:40px}

    /* Ventana (container) */
    .window{
      width:320px;
      border:2px solid #666;
      background:linear-gradient(#e9e9e9,#dcdcdc);
      box-shadow:0 6px 20px rgba(0,0,0,0.5);
      border-radius:4px;
      overflow:hidden;
      user-select:none;
      position:relative;
    }

    /* Title bar estilo Windows Forms */
    .titlebar{
      height:30px;
      background:linear-gradient(#0a64d9,#085bbd);
      color:white;
      display:flex;
      align-items:center;
      padding:0 6px;
      gap:8px;
      cursor:move;
    }
    .titlebar .icon{
      width:16px;height:16px;background:#fff;border-radius:2px;margin-left:2px;flex:0 0 16px;opacity:0.95;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,0.15);
    }
    .titlebar .title{flex:1;font-weight:600;font-size:13px}

    /* Control buttons */
    .controls{display:flex;gap:4px}
    .btnctrl{
      width:34px;height:24px;border-radius:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 34px
    }
    .btnctrl:hover{filter:brightness(0.95)}
    .btn-min{background:linear-gradient(#dcdcdc,#c3c3c3);border:1px solid rgba(0,0,0,0.2)}
    .btn-max{background:linear-gradient(#dcdcdc,#c3c3c3);border:1px solid rgba(0,0,0,0.2)}
    .btn-close{background:linear-gradient(#f25b5b,#e03b3b);border:1px solid rgba(0,0,0,0.2);}
    .btnctrl svg{width:12px;height:12px;display:block}

    /* Content area */
    .content{padding:12px;background:linear-gradient(#f1f1f1,#e7e7e7);}
    .display{
      height:48px;border-radius:4px;border:1px solid #999;background:linear-gradient(#ffffff,#f0f0f0);padding:6px 10px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;font-size:20px;font-weight:600;color:#111; box-shadow:inset 0 -2px 0 rgba(0,0,0,0.02);
    }
    .subdisplay{font-size:12px;color:#444;opacity:0.8}

    /* Botonera tipo WinForms 3D */
    .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
    button.key{
      height:46px;border-radius:4px;border:1px solid #666;background:linear-gradient(#e7e7e7,#cfcfcf);cursor:pointer;font-size:16px;font-weight:600;box-shadow:0 3px 0 rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.6);
    }
    button.key:active{transform:translateY(2px);box-shadow:none}
    button.key.op{background:linear-gradient(#ffdba6,#ffc46a);border:1px solid #b37b2a}
    button.key.func{background:linear-gradient(#e3edf9,#cfe3fb);border:1px solid #7aa0d8}
    button.key.wide{grid-column:span 2}

    /* Estados minimizado / maximizado */
    .minimized .content{display:none}
    .maximized{position:fixed;left:8px;right:8px;top:8px;bottom:8px;width:auto;height:auto;border-radius:6px}

    /* Pequeños detalles */
    .footer-note{font-size:11px;color:#333;margin-top:8px;text-align:right}

    /* Focus accessible */
    button.key:focus{outline:2px solid #4d90fe}

    /* Make the window draggable within viewport */
    body.dragging{cursor:grabbing}
  </style>
</head>
<body>
  <div id="calc" class="window" role="application" aria-label="Calculadora estilo Windows Forms">
    <div id="title" class="titlebar">
      <div class="icon" aria-hidden></div>
      <div class="title">Calculadora</div>
      <div class="controls" aria-hidden>
        <div id="btnMin" class="btnctrl btn-min" title="Minimizar"><svg viewBox="0 0 10 10"><rect x="1" y="5" width="8" height="1"></rect></svg></div>
        <div id="btnMax" class="btnctrl btn-max" title="Restaurar/Maximizar"><svg viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" fill="none" stroke="#111" stroke-width="0.8"></rect></svg></div>
        <div id="btnClose" class="btnctrl btn-close" title="Cerrar"><svg viewBox="0 0 10 10"><path d="M2 2 L8 8 M8 2 L2 8" stroke="#fff" stroke-width="0.9" stroke-linecap="round"></path></svg></div>
      </div>
    </div>

    <div class="content">
      <div class="display" id="display" aria-live="polite">
        <div class="subdisplay" id="expr">&nbsp;</div>
        <div id="value">0</div>
      </div>

      <div class="keys" role="group" aria-label="Teclado de la calculadora">
        <button class="key func" data-key="C">C</button>
        <button class="key func" data-key="⌫">⌫</button>
        <button class="key func" data-key="%">%</button>
        <button class="key op" data-key="/">÷</button>

        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key op" data-key="*">×</button>

        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key op" data-key="-">−</button>

        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key op" data-key="+">+</button>

        <button class="key wide" data-key="0">0</button>
        <button class="key" data-key=".">.</button>
        <button class="key op" data-key="=">=</button>
      </div>

      <div class="footer-note">Simula Windows Forms — HTML/CSS/JS en un solo archivo</div>
    </div>
  </div>

  <script>
    (function(){
      const win = document.getElementById('calc');
      const title = document.getElementById('title');
      const btnMin = document.getElementById('btnMin');
      const btnMax = document.getElementById('btnMax');
      const btnClose = document.getElementById('btnClose');
      const exprEl = document.getElementById('expr');
      const valueEl = document.getElementById('value');

      // Calculator state
      let current = '0';
      let expression = '';
      let resetNext = false;

      function updateDisplay(){
        valueEl.textContent = current;
        exprEl.textContent = expression || '\u00A0';
      }

      function inputDigit(d){
        if(resetNext){ current = (d === '.') ? '0.' : d; resetNext = false; return }
        if(d === '.' && current.includes('.')) return;
        if(current === '0' && d !== '.') current = d; else current += d;
      }

      function applyOperator(op){
        if(op === 'C'){
          current = '0'; expression = ''; resetNext = false; return
        }
        if(op === '⌫'){
          if(current.length>1) current = current.slice(0,-1); else current = '0'; return
        }
        if(op === '%'){
          current = String(parseFloat(current) / 100); resetNext = true; return
        }
        if(op === '='){
          try{
            const safeExpr = (expression + current).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
            // Basic safety: only allow digits, operators, dot, parentheses, percent handled
            if(!/^[0-9+\-*/(). ]+$/.test(safeExpr)) throw 'err';
            let result = Function('return ('+safeExpr+')')();
            if(!isFinite(result)) throw 'err';
            current = String(result);
            expression = '';
            resetNext = true;
          }catch(e){ current = 'Error'; expression = ''; resetNext = true }
          return
        }
        // for other operators + - * /
        // append current and operator to expression
        expression = (expression || '') + current + op;
        resetNext = true;
      }

      // Hook buttons
      document.querySelectorAll('button.key').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const k = btn.dataset.key;
          if(/[0-9.]/.test(k)) inputDigit(k);
          else applyOperator(k);
          updateDisplay();
        })
      })

      // Keyboard support
      window.addEventListener('keydown', (e)=>{
        const map = { 'Enter':'=', 'Backspace':'⌫', 'Escape':'C', '/':'/', '*':'*','-':'-','+':'+','.':'.' };
        if(map[e.key]){ applyOperator(map[e.key]); updateDisplay(); e.preventDefault(); return }
        if(/^[0-9]$/.test(e.key)){ inputDigit(e.key); updateDisplay(); e.preventDefault(); return }
      })

      updateDisplay();

      // Title bar actions: minimize, maximize/restore, close (hide)
      btnMin.addEventListener('click', ()=>{ win.classList.toggle('minimized'); });
      btnMax.addEventListener('click', ()=>{ win.classList.toggle('maximized'); document.body.classList.remove('dragging'); });
      btnClose.addEventListener('click', ()=>{ win.style.display = 'none'; });

      // Draggable window
      let dragging = false, offsetX=0, offsetY=0;
      title.addEventListener('mousedown', (e)=>{
        if(e.target.closest('.btnctrl')) return; // ignore clicks on controls
        dragging = true; document.body.classList.add('dragging');
        const rect = win.getBoundingClientRect();
        offsetX = e.clientX - rect.left; offsetY = e.clientY - rect.top;
        win.style.position = 'fixed';
        win.style.margin = '0';
        win.style.left = rect.left + 'px'; win.style.top = rect.top + 'px';
        win.style.right = 'auto'; win.style.bottom = 'auto';
      });
      window.addEventListener('mousemove', (e)=>{
        if(!dragging) return;
        let nx = e.clientX - offsetX; let ny = e.clientY - offsetY;
        // clamp to viewport
        const pad = 8; const vw = window.innerWidth, vh = window.innerHeight;
        nx = Math.max(pad, Math.min(vw - win.offsetWidth - pad, nx));
        ny = Math.max(pad, Math.min(vh - win.offsetHeight - pad, ny));
        win.style.left = nx + 'px'; win.style.top = ny + 'px';
      });
      window.addEventListener('mouseup', ()=>{ dragging=false; document.body.classList.remove('dragging'); });

      // Double click title to toggle maximize
      title.addEventListener('dblclick', ()=>{ btnMax.click() });

      // Prevent text selection while dragging
      title.addEventListener('dragstart', (e)=>e.preventDefault());

    })();
  </script>
</body>
</html>
